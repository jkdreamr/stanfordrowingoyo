<!doctype html>
<html lang="en" class="launching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8C1515" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: dark)" />
    <style>
      html.launching {
        background: #8c1515;
      }
      body {
        margin: 0;
      }
      #launch-splash,
      #launch-splash *,
      #launch-splash *::before {
        box-sizing: border-box;
      }
      #launch-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow: hidden;
        background: #8c1515;
        color: #fff;
        opacity: 1;
        transition: opacity 250ms cubic-bezier(0.16, 1, 0.3, 1);
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #launch-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      .splash-brand {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
      }
      .splash-emblem {
        opacity: 1;
        transform: scale(1);
        transition:
          transform 250ms cubic-bezier(0.32, 0, 0.67, 0),
          opacity 250ms ease-out;
      }
      #launch-splash.is-leaving .splash-emblem {
        transform: scale(1.08);
        opacity: 0;
      }
      .splash-mark {
        position: relative;
        width: 96px;
        height: 96px;
        animation: splash-mark-enter 350ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-mark img {
        position: absolute;
        inset: 6px;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        opacity: 0;
      }
      .splash-mark img.is-loaded {
        opacity: 1;
      }
      .splash-ring-half,
      .splash-ring-half::before {
        position: absolute;
        inset: 0;
      }
      .splash-ring-half {
        clip-path: inset(0 0 0 50%);
      }
      .splash-ring-half::before {
        content: '';
        border: 2px solid #fff;
        border-radius: 50%;
        clip-path: inset(0 50% 0 0);
        animation: splash-ring-draw 175ms linear 40ms both;
      }
      .splash-ring-half + .splash-ring-half {
        clip-path: inset(0 50% 0 0);
      }
      .splash-ring-half + .splash-ring-half::before {
        clip-path: inset(0 0 0 50%);
        animation-delay: 215ms;
      }
      .splash-caption {
        transition: opacity 180ms ease-out;
      }
      #launch-splash.is-leaving .splash-caption {
        opacity: 0;
      }
      .splash-wordmark {
        display: block;
        font-size: 28px;
        font-weight: 500;
        line-height: 1;
        letter-spacing: 0.14em;
        text-indent: 0.14em;
        animation: splash-wordmark-enter 280ms cubic-bezier(0.16, 1, 0.3, 1) 80ms both;
      }
      @keyframes splash-mark-enter {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        72% {
          transform: scale(1.035);
          opacity: 1;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-ring-draw {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(180deg);
        }
      }
      @keyframes splash-wordmark-enter {
        from {
          transform: translateY(8px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-splash {
          transition: opacity 120ms ease-out;
        }
        .splash-mark,
        .splash-ring-half::before,
        .splash-wordmark {
          animation: none;
        }
        .splash-ring-half::before {
          transform: rotate(180deg);
        }
        .splash-emblem,
        .splash-caption {
          transition: none;
        }
        #launch-splash.is-leaving .splash-emblem {
          transform: none;
          opacity: 1;
        }
        #launch-splash.is-leaving .splash-caption {
          opacity: 1;
        }
      }
    </style>
    <script>
      (() => {
        let theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
    <title>Stanford Rowing OYO</title>
  </head>
  <body>
    <div id="launch-splash" role="status" aria-label="Opening OYO">
      <div class="splash-brand">
        <div class="splash-emblem">
          <div class="splash-mark">
            <img
              src="/splash/gabriel-96.webp"
              srcset="/splash/gabriel-96.webp 1x, /splash/gabriel-192.webp 2x"
              width="84"
              height="84"
              alt=""
              decoding="async"
            />
            <div class="splash-ring-half"></div>
            <div class="splash-ring-half"></div>
          </div>
        </div>
        <div class="splash-caption"><span class="splash-wordmark">OYO</span></div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('launch-splash');
        splash.dataset.started = String(performance.now());
        for (const image of splash.querySelectorAll('img')) {
          const loaded = () => {
            if (image.naturalWidth > 0) image.classList.add('is-loaded');
          };
          image.addEventListener('load', loaded, { once: true });
          if (image.complete) loaded();
        }
      })();
    </script>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
