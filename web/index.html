<!doctype html>
<html lang="en" class="launching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8C1515" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: dark)" />
    <link
      rel="preload"
      href="/fonts/source-serif-4-latin-600.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Source Serif 4';
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/source-serif-4-latin-600.woff2') format('woff2');
      }
      html.launching {
        background: #8c1515;
      }
      body {
        margin: 0;
      }
      #launch-splash,
      #launch-splash * {
        box-sizing: border-box;
      }
      #launch-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        color: white;
        background: radial-gradient(120% 90% at 20% 0%, #b3261e 0%, #8c1515 45%, #5a0c0c 100%);
        transition: transform 520ms var(--spring-smooth, cubic-bezier(0.16, 1, 0.3, 1));
      }
      .dark #launch-splash {
        background: radial-gradient(120% 90% at 20% 0%, #b3261e 0%, #8c1515 45%, #3e0808 100%);
      }
      #launch-splash.is-leaving {
        transform: translateY(-100%);
      }
      .splash-brand {
        width: min(60vw, 320px);
        text-align: center;
        transform: translateY(-12px);
      }
      .splash-eight {
        width: 100%;
        overflow: visible;
      }
      .splash-boat {
        animation: first-stroke-arrive 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .splash-surge {
        animation: first-stroke-surge 310ms ease-in-out 100ms 2;
      }
      .splash-oar {
        transform-box: fill-box;
        transform-origin: 100% 100%;
        animation: first-stroke-oar 310ms ease-in-out 100ms 2;
      }
      .splash-wake {
        transform-origin: 100% 50%;
        transform-box: fill-box;
        animation: first-stroke-wake 600ms ease-out 100ms both;
      }
      .splash-oar[d='M0 0L-22 31'] {
        transform-origin: 100% 0%;
        animation-name: first-stroke-oar-port;
      }
      .splash-caption {
        margin-top: 24px;
      }
      .splash-wordmark {
        display: block;
        font:
          600 48px/1.1 'Source Serif 4',
          Georgia,
          serif;
        letter-spacing: -0.035em;
        animation: first-stroke-word 300ms cubic-bezier(0.16, 1, 0.3, 1) 420ms both;
      }
      @keyframes first-stroke-arrive {
        from {
          transform: translateX(-100px);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      @keyframes first-stroke-oar {
        0%,
        100% {
          transform: rotate(-28deg);
        }
        40% {
          transform: rotate(22deg);
        }
      }
      @keyframes first-stroke-surge {
        0%,
        100% {
          transform: translateX(0);
        }
        40% {
          transform: translateX(6px);
        }
      }
      @keyframes first-stroke-oar-port {
        0%,
        100% {
          transform: rotate(28deg);
        }
        40% {
          transform: rotate(-22deg);
        }
      }
      @keyframes first-stroke-wake {
        from {
          transform: scaleX(0);
          opacity: 0;
        }
        to {
          transform: scaleX(1);
          opacity: 0.35;
        }
      }
      @keyframes first-stroke-word {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-splash {
          transition: opacity 120ms ease-out;
        }
        #launch-splash.is-leaving {
          transform: none;
          opacity: 0;
        }
        .splash-boat,
        .splash-surge,
        .splash-oar,
        .splash-wake,
        .splash-wordmark {
          animation: none;
        }
        .splash-wake {
          opacity: 0.35;
        }
      }
    </style>
    <script>
      (() => {
        let theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
    <title>Stanford Rowing OYO</title>
  </head>
  <body>
    <div id="launch-splash" role="status" aria-label="Opening OYO">
      <div class="splash-brand" aria-hidden="true">
        <svg
          class="splash-eight"
          viewBox="0 0 320 96"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        >
          <g class="splash-wake">
            <path d="M-52 41H45 M-68 48H36 M-44 55H45 M-25 62H32" />
          </g>
          <g class="splash-boat">
            <g class="splash-surge">
              <path d="M12 48Q160 33 308 48Q160 63 12 48Z" />
              <path d="M52 48H270" opacity=".45" />
              <g transform="translate(80 44)"><path class="splash-oar" d="M0 0L-22 -31" /></g>
              <g transform="translate(100 52)"><path class="splash-oar" d="M0 0L-22 31" /></g>
              <g transform="translate(120 44)"><path class="splash-oar" d="M0 0L-22 -31" /></g>
              <g transform="translate(140 52)"><path class="splash-oar" d="M0 0L-22 31" /></g>
              <g transform="translate(160 44)"><path class="splash-oar" d="M0 0L-22 -31" /></g>
              <g transform="translate(180 52)"><path class="splash-oar" d="M0 0L-22 31" /></g>
              <g transform="translate(200 44)"><path class="splash-oar" d="M0 0L-22 -31" /></g>
              <g transform="translate(220 52)"><path class="splash-oar" d="M0 0L-22 31" /></g>
            </g>
          </g>
        </svg>
        <div class="splash-caption"><span class="splash-wordmark">OYO</span></div>
      </div>
    </div>
    <div id="root" inert></div>
    <script>
      (() => {
        const splash = document.getElementById('launch-splash');
        splash.dataset.started = String(performance.now());
        splash.addEventListener(
          'click',
          () => {
            document.documentElement.classList.remove('launching');
            document.getElementById('root').removeAttribute('inert');
            const dark = document.documentElement.classList.contains('dark');
            document
              .querySelectorAll('meta[name="theme-color"]')
              .forEach((meta) => (meta.content = dark ? '#0E0D0E' : '#F6F5F3'));
            splash.remove();
          },
          { once: true },
        );
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
