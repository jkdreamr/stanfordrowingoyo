<!doctype html>
<html lang="en" class="launching">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#8C1515" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#8C1515" media="(prefers-color-scheme: dark)" />
    <style>
      html.launching {
        background: #8c1515;
      }
      body {
        margin: 0;
      }
      #launch-splash,
      #launch-splash *,
      #launch-splash *::before {
        box-sizing: border-box;
      }
      #launch-splash {
        position: fixed;
        inset: 0;
        z-index: 10000;
        overflow: hidden;
        color: #fff;
        cursor: pointer;
        background:
          radial-gradient(60% 45% at 50% 46%, #a8231c 0%, rgb(168 35 28 / 0%) 100%),
          radial-gradient(90% 60% at 100% 0%, #b02a20 0%, rgb(176 42 32 / 0%) 60%),
          radial-gradient(90% 70% at 0% 100%, #5c0a0a 0%, rgb(92 10 10 / 0%) 70%), #8c1515;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', Inter, sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: transform 380ms cubic-bezier(0.65, 0, 0.35, 1);
        will-change: transform;
      }
      #launch-splash.is-leaving {
        transform: translate3d(0, -100%, 0);
        pointer-events: none;
      }
      .splash-water {
        position: absolute;
        left: 50%;
        top: calc(50% - 30px);
        width: 0;
        height: 0;
      }
      .splash-puddle {
        position: absolute;
        width: 220px;
        height: 220px;
        margin: -110px;
        border-radius: 50%;
        border: 1.5px solid rgb(255 255 255 / 55%);
        opacity: 0;
        animation: splash-puddle 1100ms cubic-bezier(0.22, 1, 0.36, 1) 140ms both;
      }
      .splash-puddle:nth-child(2) {
        animation-delay: 300ms;
      }
      .splash-puddle:nth-child(3) {
        animation-delay: 460ms;
      }
      .splash-brand {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        transition:
          transform 380ms cubic-bezier(0.65, 0, 0.35, 1),
          opacity 260ms ease-out;
      }
      #launch-splash.is-leaving .splash-brand {
        transform: translate3d(0, 30%, 0) scale(0.96);
        opacity: 0;
      }
      .splash-mark {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        box-shadow: 0 24px 48px -16px rgb(40 0 0 / 60%);
        animation: splash-mark-enter 560ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .splash-mark img {
        position: absolute;
        inset: 6px;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        opacity: 0;
        transition: opacity 160ms ease-out;
      }
      .splash-mark img.is-loaded {
        opacity: 1;
      }
      .splash-ring-half,
      .splash-ring-half::before {
        position: absolute;
        inset: 0;
      }
      .splash-ring-half {
        clip-path: inset(0 0 0 50%);
      }
      .splash-ring-half::before {
        content: '';
        border: 2px solid #fff;
        border-radius: 50%;
        clip-path: inset(0 50% 0 0);
        animation: splash-ring-draw 170ms linear 90ms both;
      }
      .splash-ring-half + .splash-ring-half {
        clip-path: inset(0 50% 0 0);
      }
      .splash-ring-half + .splash-ring-half::before {
        clip-path: inset(0 0 0 50%);
        animation-delay: 260ms;
      }
      .splash-caption {
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      .splash-wordmark {
        display: flex;
        gap: 0.08em;
        font-size: 34px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .splash-wordmark span {
        display: block;
        animation: splash-letter 520ms cubic-bezier(0.34, 1.4, 0.64, 1) 220ms both;
      }
      .splash-wordmark span:nth-child(2) {
        animation-delay: 280ms;
      }
      .splash-wordmark span:nth-child(3) {
        animation-delay: 340ms;
      }
      .splash-wake {
        width: 56px;
        height: 2px;
        border-radius: 2px;
        background: rgb(255 255 255 / 70%);
        transform-origin: left;
        animation: splash-wake 420ms cubic-bezier(0.22, 1, 0.36, 1) 400ms both;
      }
      .splash-sub {
        font-size: 15px;
        line-height: 20px;
        font-weight: 500;
        color: rgb(255 255 255 / 76%);
        animation: splash-fade 360ms ease-out 480ms both;
      }
      @keyframes splash-mark-enter {
        from {
          transform: scale(0.6);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      @keyframes splash-ring-draw {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(180deg);
        }
      }
      @keyframes splash-puddle {
        0% {
          opacity: 0.7;
          transform: scale(0.42);
        }
        100% {
          opacity: 0;
          transform: scale(1.9);
        }
      }
      @keyframes splash-letter {
        from {
          transform: translateY(14px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes splash-wake {
        from {
          transform: scaleX(0);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #launch-splash {
          transition: opacity 120ms ease-out;
        }
        #launch-splash.is-leaving {
          transform: none;
          opacity: 0;
        }
        .splash-puddle {
          display: none;
        }
        .splash-mark,
        .splash-ring-half::before,
        .splash-wordmark span,
        .splash-wake,
        .splash-sub {
          animation: none;
        }
        .splash-ring-half::before {
          transform: rotate(180deg);
        }
        .splash-brand {
          transition: none;
        }
        #launch-splash.is-leaving .splash-brand {
          transform: none;
          opacity: 1;
        }
      }
    </style>
    <script>
      (() => {
        let theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch {}
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch.png" />
    <title>Stanford Rowing OYO</title>
  </head>
  <body>
    <div id="launch-splash" role="status" aria-label="Opening OYO">
      <div class="splash-water" aria-hidden="true">
        <span class="splash-puddle"></span>
        <span class="splash-puddle"></span>
        <span class="splash-puddle"></span>
      </div>
      <div class="splash-brand">
        <div class="splash-emblem">
          <div class="splash-mark">
            <img
              src="/splash/gabriel-96.webp"
              srcset="/splash/gabriel-96.webp 1x, /splash/gabriel-192.webp 2x"
              width="84"
              height="84"
              alt=""
              decoding="async"
            />
            <div class="splash-ring-half"></div>
            <div class="splash-ring-half"></div>
          </div>
        </div>
        <div class="splash-caption">
          <span class="splash-wordmark" aria-hidden="true"
            ><span>O</span><span>Y</span><span>O</span></span
          >
          <span class="splash-wake" aria-hidden="true"></span>
          <span class="splash-sub">Stanford Rowing</span>
        </div>
      </div>
    </div>
    <script>
      (() => {
        const splash = document.getElementById('launch-splash');
        splash.dataset.started = String(performance.now());
        for (const image of splash.querySelectorAll('img')) {
          const loaded = () => {
            if (image.naturalWidth > 0) image.classList.add('is-loaded');
          };
          image.addEventListener('load', loaded, { once: true });
          if (image.complete) loaded();
        }
        const skip = () => {
          if (splash.classList.contains('is-leaving')) return;
          splash.classList.add('is-leaving');
          const root = document.documentElement;
          root.classList.remove('launching');
          document.getElementById('root').removeAttribute('inert');
          const color = root.classList.contains('dark') ? '#0D0C0C' : '#F5F3F0';
          for (const meta of document.querySelectorAll('meta[name="theme-color"]'))
            meta.setAttribute('content', color);
          const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
          setTimeout(() => splash.remove(), reduce ? 120 : 380);
        };
        splash.addEventListener('pointerdown', skip, { once: true });
        addEventListener('keydown', skip, { once: true });
      })();
    </script>
    <div id="root" inert></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
